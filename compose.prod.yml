services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-projetos-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3004:3000"
    networks:
      - infra_backend
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  infra_backend:
    external: true
    name: infra_backend
